name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'AndresSaa/ordinales-js'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run lint:types
      - run: pnpm run format:check
      - run: pnpm test
      - run: pnpm run test:coverage
      - name: Comprobar que el tag coincide con package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "El tag $GITHUB_REF_NAME no coincide con la versión $version"
            exit 1
          fi
      - run: npm install -g npm@^11.5.1
      - run: npm publish
